<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend Mentor | Results summary component</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
</head>

<body>
  <div class="card">
    <div class="card1">
      <div class="top-line">Your Result</div>
      <div class="outer">
        <div class="circle">
          <div class="score">76</div>
          <div class="outof">of 100</div>
        </div>
      </div>
      <h1>Great</h1>
      <p>You scored higher than 65% of the people who have taken these tests.</p>
    </div>
    <div class="card2">
      <div class="sum">Summary</div>
      <div class="bar red">
        <div>
        <img src="icon-reaction.svg" class="icon">
        <span id="reaction">Reaction</span>
        </div>
        <div>
        <span class="second-part">
          <b>80 </b>
        </span>
        <div class="hundread"> / 100</div>
        </div>
      </div>
      <div class="bar yel">
        <div>
        <img src="icon-memory.svg" class="icon">
        <span id="memo">Memory</span>
        </div>
        <div>
        <span class="second-part">
          <b>92 </b>
        </span>
        <div class="hundread"> / 100</div>
        </div>
      </div>
      <div class="bar gre">
        <div>
        <img src="icon-verbal.svg" class="icon">
        <span id="verbal">Verbal</span>
        </div>
        <div>
        <span class="second-part">
          <b>61</b>
        </span>
        <div class="hundread"> / 100</div>
        </div>
      </div>
      <div class="bar blu">
        <div>
        <img src="icon-visual.svg" class="icon">
        <span id="visual">Visual</span>
        </div>
        <div>
        <span class="second-part">
          <b>72 </b>
        </span>
        <div class="hundread"> / 100</div>
        </div>
      </div>
      <div class="foot">
        Continue
      </div>
    </div>
  </div>
</body>

</html>
